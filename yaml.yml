# ==============================================================================
# YAML 1.2 SYNTAX HIGHLIGHTING TEST SUITE (PROŠIRENO: ANKORE, ALIJASI, MERGE)
# ==============================================================================

---
# 1. OSNOVNI TIPOVI PODATAKA (SCALARS)
string_double_quoted: "Običan tekst sa \"navodnicima\", escape sekvencama \n \t \u0041 i emoji 🚀"
string_single_quoted: 'Jednostruki navodnici: "ne escape-uje" \n ali ''dupli apostrof'' jeste apostrof'
string_plain: Običan ne-navodnički string bez posebnih znakova na početku
string_with_colon: "Tekst sa dvotačkom: radi samo pod navodnicima"

integer_dec: 42
integer_neg: -128
integer_pos: +99
integer_underscore: 1_000_000
integer_octal_0o: 0o755         # YAML 1.2 oktalni format
integer_hex: 0xDEADBEEF         # Heksadecimalni format

float_standard: 3.14159
float_neg: -0.001
float_scientific: 6.022e23
float_scientific_neg: 1.5E-4
float_inf: .inf
float_neg_inf: -.inf
float_nan: .nan

boolean_true: true
boolean_false: false
yaml12_string_yes: yes
yaml12_string_no: no

null_tilde: ~
null_word: null
null_empty:

# 2. DATUMI I VREMENA (TIMESTAMPS)
date_only: 2026-11-19
timestamp_iso: 2026-11-19T21:20:00+01:00
timestamp_utc: 2026-11-19T20:20:00Z
timestamp_space: 2026-11-19 21:20:00.500 +01:00

# 3. VIŠELINIJSKI STRINGOVI (BLOCK SCALARS)
literal_block_clip: |
  Prvi red literal bloka.
  Drugi red zadržava prelome linija (\n).
  Treći red sa "navodnicima" i 'apostrofima'.

literal_block_strip: |-
  Uklanja završni novi red (chomp: strip).
  Bez praznog reda na kraju.

literal_block_keep: |+
  Zadržava sve završne prazne redove (chomp: keep).


folded_block_clip: >
  Ovo je folded blok gde se pojedinačni
  novi redovi pretvaraju u razmake,
  dok prazni redovi ostaju novi redovi.

  Novi pasus posle praznog reda.

folded_block_strip: >-
  Folded blok bez završnog novog reda
  i sa spojenim redovima.

indented_scalar: |2
    Ovaj blok eksplicitno zadaje uvlaku od 2 prostora
  a ovo je običan string ispod njega.

# 4. KOLEKCIJE — SEKVENCE (LISTE) I MAPE (OBJEKTI)
block_sequence:
  - Prva stavka
  - Druga stavka
  - 123
  - true
  - ugnjezdena_mapa:
      kljuc_a: vrednost_a
      kljuc_b: [1, 2, 3]

block_mapping:
  nivo_1:
    nivo_2:
      nivo_3:
        poruka: "Duboko ugnježdene mape"

flow_sequence: ["alfa", "beta", "gama", 10, 20.5, null]
flow_mapping: { ime: "Test", aktivan: true, verzija: 1.2, prazno: ~ }
nested_flow: [{ a: [1, 2] }, { b: { c: "ok" } }]

matrix_2d:
  - [1, 0, 0]
  - [0, 1, 0]
  - [0, 0, 1]

# 5. ANKORE (&), ALIJASI (*) I MERGE KLJUČEVI (<<)
osnovna_baza: &base_db
  host: localhost
  port: 5432
  pool_size: 10
  ssl: false

bezbednosna_polisa: &security_defaults
  ssl: true
  tls_version: "1.3"
  timeout: 15

podrazumevani_portovi: &default_ports
  - 80
  - 443

podrazumevani_admin: &default_admin "admin@example.com"

# Direktno korišćenje skalarnog i sekvencijalnog alijasa
kontakt_email: *default_admin
otvoreni_portovi: *default_ports
flow_sa_alijasom: [*default_admin, "backup@example.com", *default_ports]

# Merge jedne ankore
servis_dev:
  <<: *base_db
  naziv: "dev-servis"
  pool_size: 5

# Merge više ankora u listi (levija ankora ima prednost nad desnom u listi,
# dok eksplicitni ključevi u mapi imaju prednost nad merge-om)
servis_prod:
  naziv: "prod-servis"
  <<: [*security_defaults, *base_db]
  host: db.prod.example.com
  port: 6432

# 6. EKSPLICITNI TAGOVI (!!)
explicit_str: !!str 12345
explicit_int: !!int "42"
explicit_float: !!float "3.14"
explicit_bool: !!bool "true"
explicit_null: !!null "bilo sta"
explicit_seq: !!seq [a, b, c]
explicit_map: !!map { k1: v1, k2: v2 }
custom_tag: !custom/widget
  id: w-01
  enabled: true

# 7. KOMPLEKSNI KLJUČEVI (?) I KLJUČEVI SA VIŠE REDOVA
? >
  Ključ koji je napisan
  kao folded blok sa više redova
: Vrednost pridružena kompleksnom ključu

? [ "kompozitni", "ključ", 1 ]
: "Vrednost za listu kao ključ"

# 8. KRAJNJI / SPECIFIČNI SLUČAJEVI (EDGE CASES)
empty_collection_flow_seq: []
empty_collection_flow_map: {}
colon_before_space: "a:b/c:d" # nema razmaka posle ':' pa nije mapping separator
hash_inside_string: "Ovo # nije komentar"
hash_after_space: "Ovo nije komentar" # A ovo jeste komentar!

...
# KRAJ DOKUMENTA (document end marker `...`)
